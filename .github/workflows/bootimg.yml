name: bootimg

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  LUMA_IMAGE: https://media.simplyluma.com/media/aarch64/nightly/luma-nightly-20261115.2-aarch64-disk.sparse
  LUMA_SHA256: https://media.simplyluma.com/media/aarch64/nightly/luma-nightly-20261115.2-aarch64-disk.sparse.sha256
  KERNEL_REPO: https://github.com/AgentFabulous/begonia
  KERNEL_COMMIT: 78b3211ba301969cbb685fb9890c7b14d14497f1

jobs:
  bootimg:
    name: kernel + Luma image + boot.img
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential bc bison flex libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu python3 python3-pip xz-utils device-tree-compiler cpio >/dev/null
          python3 -m pip install --quiet --break-system-packages mkbootimg

      - name: Luma ARM image (verify the published hash)
        run: |
          mkdir -p out/luma
          curl -fsSL --retry 3 -o out/luma/luma.sparse "$LUMA_IMAGE"
          curl -fsSL --retry 3 -o out/luma/luma.sparse.sha256 "$LUMA_SHA256"
          cd out/luma
          expected=$(awk '{print $1}' luma.sparse.sha256)
          actual=$(sha256sum luma.sparse | awk '{print $1}')
          test "$expected" = "$actual" || { echo "Luma image hash mismatch"; exit 1; }
          echo "Luma image ok: $actual"

      - name: Vendor kernel (pinned)
        run: |
          git init -q kernel
          git -C kernel remote add origin "$KERNEL_REPO"
          git -C kernel fetch -q --depth 1 origin "$KERNEL_COMMIT"
          git -C kernel checkout -q FETCH_HEAD
          git -C kernel log -1 --oneline

      - name: Configure (FUSE is Luma's requirement)
        working-directory: kernel
        run: |
          if [ -f arch/arm64/configs/begonia_user_defconfig ]; then
            make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- begonia_user_defconfig
          elif [ -f arch/arm64/configs/begonia_defconfig ]; then
            make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- begonia_defconfig
          else
            make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          fi
          ./scripts/config --enable FUSE_FS --enable BLK_DEV_INITRD --enable DEVTMPFS
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          grep -E "^CONFIG_(FUSE_FS|BLK_DEV_INITRD|DEVTMPFS)=" .config

      - name: Build Image.gz
        working-directory: kernel
        run: |
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- Image.gz -j"$(nproc)"
          cp arch/arm64/boot/Image.gz ../out/Image.gz
          ls -l ../out/Image.gz

      - name: Initramfs
        run: |
          sh scripts/mkinitramfs.sh

      - name: boot.img
        run: |
          python3 scripts/pack_bootimg.py out/Image.gz out/initramfs.cpio.gz out/boot.img

      - name: Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luma-begonia-bootimg
          path: |
            out/boot.img
            out/Image.gz
            out/initramfs.cpio.gz
            out/luma/luma.sparse.sha256
          if-no-files-found: error
          retention-days: 14
